<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="VeriScope AI — Autonomous multi-agent research and factual verification platform. Coordinates 7 specialized AI agents to collect evidence, extract claims, detect contradictions, and generate transparent research reports." />
    <meta name="keywords" content="AI research, fact-checking, multi-agent, verification, VeriScope" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="VeriScope AI — Multi-Agent Research & Fact-Checking" />
    <meta property="og:description" content="7 specialized AI agents working in concert to verify facts and generate transparent research reports." />
    <meta property="og:type" content="website" />
    <title>VeriScope AI — Multi-Agent Research &amp; Fact-Checking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Skip to main content link for keyboard users */
      .skip-to-main {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
        z-index: -999;
      }
      .skip-to-main:focus {
        position: fixed;
        top: 0;
        left: 0;
        width: auto;
        height: auto;
        padding: 12px 20px;
        background: #4f46e5;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        z-index: 9999;
        border-radius: 0 0 8px 0;
        outline: 3px solid #fff;
        overflow: visible;
      }
      /* Ensure focus rings are always visible */
      :focus-visible {
        outline: 2px solid #6366f1 !important;
        outline-offset: 2px !important;
      }
      /* High contrast focus for interactive elements */
      button:focus-visible, a:focus-visible, [role="button"]:focus-visible, input:focus-visible {
        outline: 2px solid #818cf8 !important;
        outline-offset: 3px !important;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <!-- Skip Navigation Link (WCAG 2.1 AA requirement) -->
    <a href="#main-content" class="skip-to-main" tabindex="1">Skip to main content</a>

    <!-- Screen reader announcements for dynamic content -->
    <div
      id="sr-announcer"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      class="sr-only"
      style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;"
    ></div>
    <div
      id="sr-alert"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
      class="sr-only"
      style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;"
    ></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
